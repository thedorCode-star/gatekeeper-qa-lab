name: k6 Performance Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "performance/**"
      - ".github/workflows/k6-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 threshold gate
        uses: grafana/run-k6-action@v1
        with:
          path: ./performance/menu-load-test.js
